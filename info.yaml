project:
  title: "TinyMAC"
  author: "TinyMAC Team - DUTH"
  discord: ""
  description: "4-bit signed MAC hardware accelerator"
  language: "SystemVerilog"
  clock_hz: 50000000
  tiles: "1x1"

  top_module: "tt_um_archbsc_tinymac"

  source_files:
    - "project.v"
    - "mac_core.sv"
    - "mac_controller.sv"
    - "mac_datapath.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Dedicated inputs
  ui[0]: "strobe"
  ui[1]: "read_sel[0]"
  ui[2]: "read_sel[1]"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: "opcode[0]"
  ui[7]: "opcode[1]"

  # Dedicated outputs
  uo[0]: "result[0]"
  uo[1]: "result[1]"
  uo[2]: "result[2]"
  uo[3]: "result[3]"
  uo[4]: "result[4]"
  uo[5]: "result[5]"
  uo[6]: "result[6]"
  uo[7]: "result[7]"

  # Bidirectional pins (used as inputs)
  uio[0]: "x[0] / bias[0]"
  uio[1]: "x[1] / bias[1]"
  uio[2]: "x[2] / bias[2]"
  uio[3]: "x[3] / bias[3]"
  uio[4]: "w[0] / bias[4]"
  uio[5]: "w[1] / bias[5]"
  uio[6]: "w[2] / bias[6]"
  uio[7]: "w[3] / bias[7]"


# Do not change!
yaml_version: 6
